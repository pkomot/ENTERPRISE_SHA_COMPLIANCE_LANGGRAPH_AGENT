[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sha-compliance-agent"
version = "0.1.0"
description = "Async LangGraph multi-agent compliance auditor for Kenya SHA / DHA facility regulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "aiosqlite>=0.20",
    "langchain>=1.2,<2",
    "langchain-core>=1.2,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
sha-audit = "sha_compliance_agent.__main__:cli"

[tool.setuptools.packages.find]
include = ["sha_compliance_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
