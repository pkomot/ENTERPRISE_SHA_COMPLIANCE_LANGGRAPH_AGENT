name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Do not include real facility, patient or credential data. Report security issues via SECURITY.md."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Command, scenario or (synthetic) payload used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / audit_errors
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [mock, live]
  - type: input
    id: python
    attributes:
      label: Python version
