name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Demo scenario to run
        type: choice
        options: [all, compliant, moratorium, invalid, degraded]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q

  demo:
    name: Run audit demo
    needs: test
    runs-on: ubuntu-latest
    env:
      SHA_AUDIT_MODE: mock
      SHA_AUDIT_CHECKPOINT_DB: ${{ github.workspace }}/audit-checkpoints.sqlite
      # Uses Claude for extraction and narratives when the secret is configured;
      # otherwise the deterministic offline engine runs.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[anthropic]"
      - name: Run demo
        run: |
          python -m sha_compliance_agent \
            --scenario "${{ inputs.scenario || 'all' }}" \
            --report-dir reports | tee reports-console.log
      - name: Job summary
        if: always()
        run: |
          if compgen -G "reports/*.md" > /dev/null; then
            for f in reports/*.md; do cat "$f"; echo; echo '---'; done >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-reports
          path: |
            reports/
            reports-console.log
          if-no-files-found: ignore
